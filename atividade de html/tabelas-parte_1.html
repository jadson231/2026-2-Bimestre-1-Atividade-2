<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercícios de Tabelas - Parte 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h2 {
            margin-top: 40px;
        }
        table {
            border-collapse: collapse;
            margin-bottom: 25px;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 12px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Exercício 1: Tabelas e Mesclagens</h1>

    <!-- Letra A: Tabela de Notas e Bimestres -->
    <h3>a) Notas por Bimestre</h3>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Disciplina</th>
                <th colspan="2">1º bimestre</th>
                <th colspan="2">2º bimestre</th>
            </tr>
            <tr>
                <th>F</th>
                <th>N</th>
                <th>F</th>
                <th>N</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="text-align: left;">Matemática</td>
                <td>0</td>
                <td>100</td>
                <td>2</td>
                <td>90</td>
            </tr>
            <tr>
                <td style="text-align: left;">Inglês</td>
                <td>3</td>
                <td>85</td>
                <td>0</td>
                <td>95</td>
            </tr>
            <tr>
                <td style="text-align: left;">História</td>
                <td>10</td>
                <td>60</td>
                <td>0</td>
                <td>80</td>
            </tr>
        </tbody>
    </table>

    <!-- Letra B -->
    <h3>b) Mesclagem B</h3>
    <table>
        <tr>
            <td>A</td>
            <td rowspan="3">B</td>
            <td>C</td>
        </tr>
        <tr>
            <td>D</td>
            <td>E</td>
        </tr>
        <tr>
            <td>F</td>
            <td>G</td>
        </tr>
    </table>

    <!-- Letra C -->
    <h3>c) Mesclagem C</h3>
    <table>
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
            <td>G</td>
        </tr>
        <tr>
            <td>H</td>
            <td colspan="2">I</td>
            <td colspan="2">J</td>
            <td colspan="2">K</td>
        </tr>
        <tr>
            <td>L</td>
            <td>M</td>
            <td>N</td>
            <td colspan="3">O</td>
            <td>P</td>
        </tr>
    </table>

    <!-- Letra D -->
    <h3>d) Mesclagem D</h3>
    <table>
        <tr>
            <td>A</td>
            <td>B</td>
            <td rowspan="3">C</td>
        </tr>
        <tr>
            <td colspan="2">D</td>
        </tr>
        <tr>
            <td>E</td>
            <td>F</td>
        </tr>
    </table>

</body>
</html>
